version: "3.9"
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pps_dev
    ports:
      - "5432:5432"
    volumes:
      - pps_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/pps_dev
      DATABASE_URL_SYNC: postgresql+psycopg://postgres:postgres@db:5432/pps_dev
      JWT_SECRET_KEY: dev-secret-change-in-production
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"

volumes:
  pps_pgdata:
